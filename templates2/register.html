<!DOCTYPE html>
<html>
<head>
    <title>Registracija - Socialna platforma</title>
        <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h1, h2, h3 {
        color: #444;
        margin-bottom: 10px;
    }


    button {
        padding: 8px 14px;
        background: black;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }

</style>
</head>
<body>
    <h1>Registracija - Socialna platforma</h1>
    <form method="post">
        <input type="text" name="username" placeholder="Uporabniško ime" required>
        <input type="password" name="password" placeholder="Geslo" required>
        <button type="submit">Registracija</button>
    </form>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <p>Že imate račun? <a href="{{ url_for('login') }}">Prijava</a></p>
</body>
</html>
