<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prijava - Osebni zapiski</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h1, h2, h3 {
        color: #444;
        margin-bottom: 10px;
    }


    button {
        padding: 8px 14px;
        background: black;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }

</style>

</head>
<body>
    <h1>Prijava</h1>

    <form method="post">
        <input type="text" name="username" placeholder="Uporabniško ime" required>
        <br><br>
        <input type="password" name="password" placeholder="Geslo" required>
        <br><br>
        <button type="submit">Prijava</button>
    </form>

    {% if error %}
        <div style="color:red;">{{ error }}</div>
    {% endif %}

    <p>Nimate računa? <a href="{{ url_for('register') }}">Registracija</a></p>
</body>
</html>
