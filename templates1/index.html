<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Osebni zapiski</title>
</head>
<body>

    <h1>Osebni zapiski</h1>

    <p>Pozdravljen, {{ session.username }}</p>

    <a href="{{ url_for('logout') }}">
        <button>Odjava</button>
    </a>

    <hr>

    <h2>Dodaj zapis</h2>

    <form id="add-form">
        <input type="text" id="title" placeholder="Naslov" required>
        <br><br>
        <textarea
            id="content"
            placeholder="Vsebina"
            rows="5"
            required></textarea>
        <br><br>
        <button type="submit">Dodaj</button>
    </form>

    <hr>

    <h2>Moji zapiski</h2>

    <div id="notes-container">
        {% for note in notes %}
            <div id="note-{{ note.id }}">
                <h3>{{ note.title }}</h3>
                <p>{{ note.content }}</p>

                <button onclick="startEdit({{ note.id }}, '{{ note.title|escape }}', `{{ note.content|escape }}`)">
                    Uredi
                </button>

                <button onclick="deleteNote({{ note.id }})">
                    Izbriši
                </button>

                <hr>
            </div>
        {% endfor %}
    </div>

    <script>
        // Dodajanje novega zapisa
        document.getElementById("add-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            const res = await fetch("/api/notes/add", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ title, content })
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Napaka pri dodajanju");
                return;
            }

            // Osveži stran, da se prikaže nov zapis
            location.reload();
        });


        // Brisanje zapisa
        async function deleteNote(id) {
            if (!confirm("Res želiš izbrisati ta zapis?")) return;

            const res = await fetch(`/api/notes/${id}/delete`, {
                method: "DELETE"
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Napaka pri brisanju");
                return;
            }

            document.getElementById("note-" + id).remove();
        }


        // Urejanje zapisa (preko promptov – enostavno za razlago)
        async function startEdit(id, oldTitle, oldContent) {
            const newTitle = prompt("Nov naslov:", oldTitle);
            if (newTitle === null) return;

            const newContent = prompt("Nova vsebina:", oldContent);
            if (newContent === null) return;

            const res = await fetch(`/api/notes/${id}/edit`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ title: newTitle, content: newContent })
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Napaka pri urejanju");
                return;
            }

            // Osveži stran, da se prikažejo spremembe
            location.reload();
        }
    </script>

</body>
</html>
